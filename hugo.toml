baseURL = "https://frknilisu.github.io/"
theme = "hugo-bearblog"

title = "Yazılar"
languageCode = "tr"
defaultContentLanguage = "tr"

enableRobotsTXT = true

# Taslaklar ve gelecek tarihli yazılar derlenmez.
buildDrafts = false
buildFuture = false

[permalinks]
  posts = "/:slug/"
  tags = "/etiket/:slug/"

[taxonomies]
  tag = "tags"

[menu]
  [[menu.main]]
    name = "Yazılar"
    url = "/posts/"
    weight = 1

[params]
  description = "Kişisel deneme arşivi. Hayat, düşünce, iman, ara ara teknik meseleler."
  title = "Yazılar"
  dateFormat = "2 January 2006"
  enablePostNavigator = true

[markup]
  [markup.highlight]
    style = "friendly"
    lineNos = false
    codeFences = true
